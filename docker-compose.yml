# Local development dependencies. Start with:  docker compose up -d
#
# Values come from .env (copy .env.example). Image tags are pinned rather than
# ':latest' so that a rebuild months from now gets the same versions CI uses.

services:
  postgres:
    image: postgres:17-alpine
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketdb}
      POSTGRES_USER: ${POSTGRES_USER:-ticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The app and Flyway fail confusingly if they connect before Postgres is
      # accepting connections, so expose a real readiness signal.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket} -d ${POSTGRES_DB:-ticketdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Azure Blob Storage / Queue emulator, used for ticket attachments
  # (milestone 6) and the notification queue (milestone 9).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: ticket-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --location /data
      --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
      - "${AZURITE_QUEUE_PORT:-10001}:10001"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
