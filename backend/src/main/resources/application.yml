spring:
  application:
    name: ticket-system

  datasource:
    # Defaults match .env.example / docker-compose.yml so the app runs locally
    # with no extra setup. Production values come from the environment.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketdb}
    username: ${DB_USER:ticket}
    password: ${DB_PASSWORD:ticket_local_dev_only}

  jpa:
    # Flyway owns the schema. 'validate' makes Hibernate check that the entities
    # match the migrated tables and fail fast if they have drifted, rather than
    # silently altering the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Store and read all timestamps as UTC regardless of the server's zone,
        # so SLA arithmetic is not affected by where the app happens to run.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
